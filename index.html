<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markov Sound Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root{
    --bg:#0e1116; --panel:#141c26; --line:#2b3644; --line2:#3a4756;
    --text:#e6edf6; --muted:#9aabc0; --accent:#a0e7e5; --danger:#ff9aa2;
    --radius:14px; --border:2px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);
    font:16px/1.5 'Jua',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  button{
    font:inherit;font-size:15px;color:var(--text);background:#1c2532;border:var(--border) solid var(--line2);
    border-radius:12px;padding:6px 12px;cursor:pointer;
  }
  button:hover{background:#25313f;border-color:#4d5d70}
  button.danger{color:var(--danger);border-color:#5a3038;background:#221719}
  button.danger:hover{background:#2e1e21}
  button.on{background:rgba(160,231,229,.18);border-color:#4f9a98;color:#c9f6f4}
  input,select{
    font:inherit;font-size:15px;color:var(--text);background:#0d1218;border:var(--border) solid var(--line2);
    border-radius:10px;padding:4px 9px;
  }
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  input[type=number]{width:64px;-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=range]{width:100%;accent-color:var(--accent);padding:0;background:none;border:none}
  #run{
    position:fixed;left:20px;bottom:20px;z-index:20;
    width:52px;height:52px;padding:0;border:none;background:none;
    display:grid;place-items:center;cursor:pointer;color:var(--accent);
    opacity:.72;transition:opacity .15s,transform .15s;
  }
  #run:hover{opacity:1;transform:scale(1.06)}
  #run svg{width:40px;height:40px;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.55))}
  #run.running{color:var(--danger)}
  #run:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:10px}
  main{flex:1;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:default}
  #menu{
    position:fixed;z-index:50;min-width:196px;padding:8px;
    background:var(--panel);border:var(--border) solid var(--line2);border-radius:18px;
    box-shadow:0 14px 36px rgba(0,0,0,.6);display:none;
    max-height:calc(100vh - 16px);overflow-y:auto;overscroll-behavior:contain;
  }
  #menu.show{display:block}
  #menu .title{
    padding:4px 10px 8px;margin-bottom:5px;border-bottom:var(--border) solid var(--line);
    color:var(--muted);font-size:13px;letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;
  }
  #menu button{
    display:flex;width:100%;align-items:center;gap:8px;text-align:left;
    background:none;border:var(--border) solid transparent;border-radius:11px;padding:6px 10px;font-size:15px;
  }
  #menu button:hover{background:#222d3b;border-color:var(--line2)}
  #menu button.danger:hover{background:#2e1e21;border-color:#5a3038}
  #menu .key{margin-left:auto;color:var(--muted);font-size:12px}
  #menu .swatches{display:flex;gap:6px;padding:2px 8px 8px;flex-wrap:wrap}
  #menu .sw{
    width:24px;height:24px;border-radius:50%;cursor:pointer;padding:0;
    border:var(--border) solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);
  }
  #menu .sw:hover{border-color:#e8f1fb}
  #menu .sw.on{border-color:#e8f1fb;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),0 0 0 2px rgba(160,231,229,.45)}
  #menu .num{display:flex;align-items:center;gap:8px;padding:2px 10px 8px;font-size:13px;color:var(--muted)}
  #menu .num input{width:74px}
  #menu .slider{display:block;padding:2px 10px 9px}
  #menu .slider .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
  #menu .slider .lab b{color:#dbe7f4;font-weight:400;font-variant-numeric:tabular-nums}
  #menu .seg{display:flex;gap:6px;padding:2px 8px 8px}
  #menu .seg button{justify-content:center;border:var(--border) solid var(--line2);background:#101720;font-size:13px;padding:5px 9px}
  #menu .seg button.on{background:rgba(160,231,229,.18);border-color:#4f9a98;color:#c9f6f4}
  #menu .rowline{display:flex;align-items:center;gap:6px;padding:2px 8px 8px}
  #menu .rowline input[type=number]{width:56px;text-align:center}
  #menu .ghost{width:30px;padding:2px 0;text-align:center}
  #hint{
    position:fixed;left:92px;bottom:22px;z-index:10;pointer-events:none;
    color:var(--muted);font-size:14px;line-height:1.7;
    padding:7px 12px;border-radius:14px;background:rgba(14,17,22,.78);
    transition:opacity .5s;
  }
  #hint.fade{opacity:0}
  #hint b{color:#bfd0e2;font-weight:400}
  #toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);
    background:var(--panel);border:var(--border) solid var(--line2);color:var(--text);
    padding:8px 16px;border-radius:16px;font-size:15px;opacity:0;pointer-events:none;
    transition:opacity .18s,transform .18s;max-width:70vw;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #selftest{
    position:fixed;inset:0;margin:0;padding:16px;overflow:auto;background:#0b0f14;color:#cfe3d8;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;z-index:99;
  }
</style>
</head>
<body>
<main>
  <canvas id="cv"></canvas>
</main>
<button id="run" aria-label="시작" title="시작 / 정지 (Space)">
  <svg id="runIcon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M8 5.5v13a1 1 0 0 0 1.54.84l10-6.5a1 1 0 0 0 0-1.68l-10-6.5A1 1 0 0 0 8 5.5z" fill="currentColor"/>
  </svg>
</button>
<div id="hint">
  <b>더블클릭</b> 빈 곳=노드 추가 · 노드=소리 선택 &nbsp;|&nbsp; <b>우클릭</b> 노드·간선·배경 메뉴 &nbsp;|&nbsp;
  <b>Shift+드래그</b> 연결 &nbsp;|&nbsp; <b>간선 위 휠</b> 확률 (Shift=10%) &nbsp;|&nbsp; <b>Del</b> 삭제 &nbsp;|&nbsp; <b>Space</b> 시작/정지
</div>
<div id="menu" role="menu"></div>
<input id="soundFile" type="file" accept="audio/*" hidden>
<input id="importFile" type="file" accept=".json,application/json" hidden>
<div id="toast"></div>
<script>
'use strict';
(function(){

// ---------------------------------------------------------------- utils
const uid = (p) => p + '_' + Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const round1 = (v) => Math.round(v * 10) / 10;
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R = 30;                      // node radius (css px)
const REPEL_MAX = 10;              // repel slider top end (was 3: too weak)
const DELAY_MAX = 2;               // seconds of silence between sounds (0 = current behaviour)
const numOrDefault = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
const COLORS = ['#ffe066','#8bb9ff','#ff9ec4','#d9b8ff','#b6e86a','#7fdcf5','#ffb98a','#a8b8ff','#ffb3f2'];
const SAVE_VERSION = 1;
const SELF_TEST = /(?:^|[?&])selftest=1(?:&|$)/.test(location.search);

// ---------------------------------------------------------------- state
const state = {
  nodes: [],        // {id, x, y, label, audio:{name,mime,data}|null}
  edges: [],        // {id, from, to, weight}
  walkerCount: 3,
  startMode: 'random',   // 'random' | 'selected'
  startNodeId: null,     // used when startMode === 'selected'
  selection: null,       // {type:'node'|'edge', id}
  walkers: [],           // runtime
  running: false,
  epoch: 0,
  physics: false,        // gravity toggle
  delay: 0,              // seconds of silence between a sound ending and the next move
  cam: { x: 0, y: 0 },   // world -> screen translation
};

const els = {};
let cw = 1, ch = 1, dpr = 1;
let drag = null;      // {kind:'node', id, ox, oy}
let soundTargetId = null;   // node awaiting a file-picker result
let linking = null;   // {from, x, y}
let menuOpen = null;  // {kind:'node'|'edge', id}

// ---------------------------------------------------------------- model
const nodeById = (id) => state.nodes.find(n => n.id === id) || null;
const edgeById = (id) => state.edges.find(e => e.id === id) || null;

// Weights are percentages: the outgoing edges of a node always sum to 100.
function nextEdgeFrom(edges, fromId, rng = Math.random) {
  const outs = edges.filter(e => e.from === fromId && e.weight > 0);
  if (!outs.length) return null;
  let total = 0;
  for (const e of outs) total += e.weight;
  let r = rng() * total;
  for (const e of outs) { r -= e.weight; if (r < 0) return e; }
  return outs[outs.length - 1];
}
function pickNext(fromId, rng = Math.random) {
  const e = nextEdgeFrom(state.edges, fromId, rng);
  return e ? nodeById(e.to) : null;
}
function outEdges(fromId) {
  return state.edges.filter(e => e.from === fromId);
}
function outWeight(fromId) {
  return outEdges(fromId).reduce((s, e) => s + e.weight, 0);
}
function edgeProbability(e) {
  const t = outWeight(e.from);
  return t > 0 ? e.weight / t : 0;
}
function edgePct(e) {
  return Math.round(e.weight * 10) / 10;
}
// Round to 0.1 while keeping the sum at exactly 100 (largest-remainder fixup).
function normalizeOutgoing(fromId) {
  const outs = outEdges(fromId);
  if (!outs.length) return;
  const sum = outs.reduce((s, e) => s + e.weight, 0);
  if (!(sum > 0)) {
    for (const e of outs) e.weight = round1(100 / outs.length);
  } else {
    for (const e of outs) e.weight = Math.round(e.weight / sum * 1000) / 10;
  }
  const after = outs.reduce((s, e) => s + e.weight, 0);
  let diff = round1(100 - after);
  if (Math.abs(diff) >= 0.05) {
    // push the leftover onto the largest edge so the sum is exactly 100
    const biggest = outs.reduce((a, b) => (b.weight > a.weight ? b : a), outs[0]);
    biggest.weight = round1(biggest.weight + diff);
  }
}
// Set one edge's percentage; the rest keep their previous ratio.
// Raising an edge to 100 stores the previous ratio so lowering it restores it.
function setEdgeWeight(e, pct) {
  const node = nodeById(e.from);
  if (!node) return e.weight;
  const outs = outEdges(e.from);
  if (outs.length <= 1) { e.weight = 100; return e.weight; }
  const target = clamp(round1(pct), 0, 100);
  const others = outs.filter(o => o.id !== e.id);
  const oldsum = others.reduce((s, o) => s + o.weight, 0);
  if (target >= 100) {
    // remember the ratio we are about to destroy
    if (oldsum > 0) {
      e.savedRatio = others.map(o => ({ id: o.id, w: o.weight }));
    }
    e.weight = 100;
    for (const o of others) o.weight = 0;
    return e.weight;
  }
  let ratios = null;
  if (e.savedRatio && target > 0) {
    // coming back down from 100: restore what was there before
    const map = new Map(e.savedRatio.map(r => [r.id, r.w]));
    if (others.every(o => map.has(o.id))) {
      ratios = others.map(o => map.get(o.id));
      e.savedRatio = null;
    }
  }
  if (!ratios) {
    if (e.weight >= 100 && target > 0) {
      // no usable memory: split evenly
      ratios = others.map(() => 1);
    } else {
      ratios = others.map(o => o.weight);
    }
  }
  const rest = round1(100 - target);
  const rsum = ratios.reduce((a, b) => a + b, 0);
  if (rsum <= 0) {
    const each = round1(rest / others.length);
    for (const o of others) o.weight = each;
  } else {
    for (let i = 0; i < others.length; i++) {
      others[i].weight = Math.round(rest * (ratios[i] / rsum) * 10) / 10;
    }
  }
  e.weight = target;
  // fix rounding drift on the others so the node totals 100
  const total = outs.reduce((s, o) => s + o.weight, 0);
  const diff = round1(100 - total);
  if (Math.abs(diff) >= 0.05) {
    const biggest = others.reduce((a, b) => (b.weight > a.weight ? b : a), others[0]);
    biggest.weight = Math.max(0, round1(biggest.weight + diff));
  }
  return e.weight;
}

function nextNodeName() {
  const used = new Set(state.nodes.map(n => n.label));
  let i = state.nodes.length + 1;
  while (used.has('N' + i)) i++;
  return 'N' + i;
}

function addNodeAt(x, y, label) {
  const n = {
    id: uid('n'), x, y, label: label || nextNodeName(), audio: null, color: null,
    gravity: 1, repel: 1, pinned: false,
  };
  state.nodes.push(n);
  return n;
}
function addEdge(from, to) {
  const existing = state.edges.find(e => e.from === from && e.to === to);
  if (existing) return existing;
  const e = { id: uid('e'), from, to, weight: 0 };
  state.edges.push(e);
  const outs = outEdges(from);
  const n = outs.length;
  const share = Math.round(100 / n * 10) / 10;
  const before = outs.filter(o => o.id !== e.id);
  const oldsum = before.reduce((s, o) => s + o.weight, 0);
  const rest = round1(100 - share);
  if (before.length) {
    if (oldsum > 0) {
      for (const o of before) o.weight = Math.round(rest * (o.weight / oldsum) * 10) / 10;
    } else {
      for (const o of before) o.weight = Math.round(rest / before.length * 10) / 10;
    }
  }
  e.weight = share;
  normalizeOutgoing(from);
  return e;
}
function deleteNode(id) {
  stopWalkers();
  state.nodes = state.nodes.filter(n => n.id !== id);
  state.edges = state.edges.filter(e => e.from !== id && e.to !== id);
  if (state.startNodeId === id) state.startNodeId = null;
  state.selection = null;
  physics.wake();
  closeMenu();
  scheduleSave();
}
function deleteEdge(id) {
  const e = edgeById(id);
  const from = e ? e.from : null;
  state.edges = state.edges.filter(x => x.id !== id);
  if (from) normalizeOutgoing(from);
  state.selection = null;
  physics.wake();
  closeMenu();
  scheduleSave();
}
function deleteSelection() {
  const s = state.selection;
  if (!s) return;
  if (s.type === 'node') deleteNode(s.id); else deleteEdge(s.id);
}

// ---------------------------------------------------------------- serialize
function serializeGraph(g = state) {
  return JSON.stringify({
    app: 'markov-sound-graph',
    version: SAVE_VERSION,
    savedAt: new Date().toISOString(),
    walkerCount: g.walkerCount,
    startMode: g.startMode,
    startNodeId: g.startNodeId,
    physics: !!g.physics,
    delay: round1(numOrDefault(g.delay, 0) * 100) / 100,
    nodes: g.nodes.map(n => ({
      id: n.id, x: round1(n.x), y: round1(n.y), label: n.label,
      color: n.color || null,
      gravity: numOrDefault(n.gravity, 1),
      repel: numOrDefault(n.repel, 1),
      pinned: !!n.pinned,
      audio: n.audio ? { name: n.audio.name, mime: n.audio.mime, data: n.audio.data } : null,
    })),
    edges: g.edges.map(e => ({ id: e.id, from: e.from, to: e.to, weight: e.weight })),
  });
}

function deserializeGraph(text) {
  const d = JSON.parse(text);
  if (!d || typeof d !== 'object' || !Array.isArray(d.nodes) || !Array.isArray(d.edges)) {
    throw new Error('그래프 파일 형식이 아닙니다');
  }
  const ids = new Set();
  const nodes = d.nodes.map(n => {
    const id = String(n && n.id != null ? n.id : uid('n'));
    if (ids.has(id)) throw new Error('노드 id가 중복됩니다: ' + id);
    ids.add(id);
    const a = n && n.audio;
    return {
      id,
      x: Number(n && n.x) || 0,
      y: Number(n && n.y) || 0,
      label: String((n && n.label) != null ? n.label : id),
      color: PALETTE.includes(n && n.color) ? n.color : null,
      gravity: clamp(numOrDefault(n && n.gravity, 1), 0, 3),
      repel: clamp(numOrDefault(n && n.repel, 1), 0, REPEL_MAX),
      pinned: !!(n && n.pinned),
      audio: a && a.data ? { name: String(a.name || 'sound'), mime: String(a.mime || ''), data: String(a.data) } : null,
    };
  });
  const edges = [];
  for (const e of d.edges) {
    if (!e) continue;
    const from = String(e.from), to = String(e.to);
    if (!ids.has(from) || !ids.has(to)) continue;   // dangling edge: drop
    edges.push({
      id: String(e.id != null ? e.id : uid('e')), from, to,
      weight: Math.max(0, Number(e.weight) || 0),
    });
  }
  // old files stored arbitrary weights; the model is now percentages
  for (const n of nodes) {
    const outs = edges.filter(e => e.from === n.id);
    if (!outs.length) continue;
    const sum = outs.reduce((s2, e) => s2 + e.weight, 0);
    if (sum > 0 && Math.abs(sum - 100) > 0.05) {
      for (const e of outs) e.weight = Math.round(e.weight / sum * 1000) / 10;
    }
  }
  return {
    nodes, edges,
    walkerCount: clamp(Number(d.walkerCount) || 3, 1, 9),
    physics: !!d.physics,
    delay: clamp(numOrDefault(Number(d.delay), 0), 0, DELAY_MAX),
    startMode: d.startMode === 'selected' ? 'selected' : 'random',
    startNodeId: nodes.some(n => n.id === d.startNodeId) ? d.startNodeId : null,
  };
}

// put the graph's centre of mass in the middle of the viewport
function fitToView() {
  const nodes = state.nodes;
  if (!nodes.length) { state.cam.x = 0; state.cam.y = 0; return; }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of nodes) {
    minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
    minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
  }
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  state.cam.x = cw / 2 - cx;
  state.cam.y = ch / 2 - cy;
}

function applyGraph(g) {
  stopWalkers();
  state.nodes = g.nodes;
  state.edges = g.edges;
  state.walkerCount = clamp(g.walkerCount || state.walkerCount, 1, 9);
  state.startMode = g.startMode || state.startMode;
  state.startNodeId = g.startNodeId || null;
  state.physics = !!g.physics;
  state.delay = clamp(numOrDefault(g.delay, 0), 0, DELAY_MAX);
  state.selection = null;
  state.walkers = [];
  fitToView();
  physics.wake();
  closeMenu();
  syncControls();
}

// ---------------------------------------------------------------- storage
const idb = {
  _p: null,
  name: 'markov-sound-graph',
  store: 'kv',
  open() {
    if (this._p) return this._p;
    this._p = new Promise((res, rej) => {
      const rq = indexedDB.open(this.name, 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore(this.store);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error || new Error('IndexedDB 열기 실패'));
    });
    return this._p;
  },
  async get(k) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const rq = db.transaction(this.store, 'readonly').objectStore(this.store).get(k);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  },
  async set(k, v) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(this.store, 'readwrite');
      tx.objectStore(this.store).put(v, k);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
};

let saveTimer = null;
let saveFailed = false;
let hintFaded = false;
function fadeHint() {
  if (hintFaded || SELF_TEST) return;
  hintFaded = true;
  const h = document.getElementById('hint');
  if (h) h.classList.add('fade');
}

function scheduleSave() {
  if (SELF_TEST) return;
  fadeHint();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 400);
}
async function saveNow() {
  try {
    await idb.set('graph', serializeGraph());
    saveFailed = false;
  } catch (e) {
    console.warn('autosave failed', e);
    if (!saveFailed) { saveFailed = true; toast('브라우저 저장 실패 — 파일로 저장을 사용하세요'); }
  }
}

// ---------------------------------------------------------------- audio
function b64ToBuffer(dataUrl) {
  const i = dataUrl.indexOf('base64,');
  const b64 = i >= 0 ? dataUrl.slice(i + 7) : dataUrl;
  const bin = atob(b64);
  const u = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
  return u.buffer;
}

const audio = {
  ctx: null,
  master: null,
  cache: new Map(),     // dataUrl -> AudioBuffer
  bad: new Set(),       // dataUrls that failed to decode
  waiting: new Set(),   // started BufferSources
  ensure() {
    if (this.ctx) return this.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(this.ctx.destination);
    return this.ctx;
  },
  async resume() {
    const c = this.ensure();
    if (c.state !== 'running') { try { await c.resume(); } catch (e) {} }
    return c;
  },
  async buffer(node) {
    if (!node.audio) return null;
    const key = node.audio.data;
    if (this.cache.has(key)) return this.cache.get(key);
    if (this.bad.has(key)) return null;   // already known broken: stay silent
    this.ensure();
    try {
      const buf = await this.ctx.decodeAudioData(b64ToBuffer(key));
      if (this.cache.size >= 64) this.cache.clear();
      this.cache.set(key, buf);
      return buf;
    } catch (e) {
      this.bad.add(key);
      throw e;
    }
  },
  play(buf) {
    const c = this.ensure();
    const src = c.createBufferSource();
    src.buffer = buf;
    src.connect(this.master);
    this.waiting.add(src);
    const p = new Promise(res => {
      src.onended = () => { this.waiting.delete(src); res(); };
    });
    src.start();
    return p;
  },
  stopAll() {
    for (const src of Array.from(this.waiting)) {
      try { src.stop(); } catch (e) {}
      this.waiting.delete(src);
    }
  },
};

// ---------------------------------------------------------------- walkers
function abortableSleep(ms, epoch) {
  return new Promise(res => {
    const t = setTimeout(done, ms);
    const iv = setInterval(() => { if (epoch !== state.epoch) done(); }, 50);
    function done() { clearTimeout(t); clearInterval(iv); res(); }
  });
}

async function playNodeSound(w, node) {
  const epoch = w.epoch;
  let buf = null;
  try {
    buf = await audio.buffer(node);
  } catch (e) {
    console.warn('decode failed', e);
    if (!playNodeSound.warned) playNodeSound.warned = new Set();
    const key = node.audio ? node.audio.name : node.label;
    if (!playNodeSound.warned.has(key)) {
      playNodeSound.warned.add(key);
      toast('소리를 재생할 수 없습니다: ' + key);
    }
    buf = null;
  }
  if (epoch !== state.epoch || !state.running) return;
  if (!buf) { await abortableSleep(320, epoch); return; }
  try { await audio.resume(); } catch (e) {}
  if (epoch !== state.epoch || !state.running) return;
  w.playingAt = node.id;
  try {
    await audio.play(buf);
  } catch (e) {
    console.warn('play failed', e);
    await abortableSleep(320, epoch);
  }
  w.playingAt = null;
}

// pure decoration: the walker token slides along the edge without holding up
// the next sound, so with delay = 0 the next note starts immediately and the
// slide overlaps it.
function startWalkerAnim(w, from, to) {
  const edge = state.edges.find(e => e.from === from.id && e.to === to.id);
  // a very short sound can start the next slide mid-slide; blend from wherever
  // the token is drawn right now instead of snapping back
  const fromPos = w.anim && w.pos ? { x: w.pos.x, y: w.pos.y } : null;
  const anim = { from, to, t0: performance.now(), dur: 180, geom: edge ? edgeGeom(edge) : null, fromPos };
  w.anim = anim;
  setTimeout(() => { if (w.anim === anim) { w.anim = null; w.pos = null; } }, anim.dur + 10);
}

async function runWalker(w) {
  while (state.running && w.epoch === state.epoch) {
    const cur = nodeById(w.nodeId);
    if (!cur) { w.dead = true; checkAllDead(); break; }
    await playNodeSound(w, cur);
    if (!(state.running && w.epoch === state.epoch)) break;
    if (state.delay > 0) {
      // read the delay each step so a change during playback applies at once
      await abortableSleep(state.delay * 1000, w.epoch);
      if (!(state.running && w.epoch === state.epoch)) break;
    }
    const next = pickNext(cur.id);
    if (!next) { w.dead = true; checkAllDead(); break; }
    // the slide is decoration only — never wait for it, or delay = 0 would
    // still cost the animation time before the next sound
    startWalkerAnim(w, cur, next);
    w.nodeId = next.id;
  }
}

function pickStartNode() {
  if (state.startMode === 'selected') {
    return state.startNodeId ? nodeById(state.startNodeId) : null;
  }
  if (!state.nodes.length) return null;
  return state.nodes[Math.floor(Math.random() * state.nodes.length)];
}

function startWalkers() {
  if (state.running) return;
  if (!state.nodes.length) { toast('먼저 노드를 만드세요'); return; }
  const first = pickStartNode();
  if (!first) { toast('시작 노드를 선택하거나 "랜덤 노드"로 바꾸세요'); return; }
  state.running = true;
  state.epoch++;
  state.walkers = [];
  // warm the decode cache so later steps are tight
  let withAudio = 0;
  for (const n of state.nodes) {
    if (!n.audio) continue;
    withAudio++;
    audio.buffer(n).catch(() => {});
  }
  if (!withAudio) toast('소리가 지정된 노드가 없습니다 — 노드를 클릭해 소리 파일을 넣으세요');
  for (let i = 0; i < state.walkerCount; i++) {
    const start = state.startMode === 'selected' ? first : pickStartNode();
    if (!start) break;
    const w = { i, color: COLORS[i % COLORS.length], nodeId: start.id, anim: null, dead: false, epoch: state.epoch, playingAt: null };
    state.walkers.push(w);
    runWalker(w);
  }
  syncControls();
}

function checkAllDead() {
  if (!state.running) return;
  if (state.walkers.every(w => w.dead)) {
    stopWalkers();
    toast('워커가 막다른 노드에 도달했습니다 — 나가는 연결을 추가하세요');
  }
}

function stopWalkers() {
  if (!state.running && !state.walkers.length) return;
  state.running = false;
  state.epoch++;
  audio.stopAll();
  state.walkers = [];
  syncControls();
}

// ---------------------------------------------------------------- physics
// Placement tool, not a live effect: it settles and then stops.
// Forces per node: gravity pulls toward the graph's centre of mass, repel
// pushes overlapping nodes apart, edges act as springs, and pinned nodes
// never move. Pinned means fixed on screen, so the camera stops following the
// centre of mass as soon as one node is pinned: a moving camera would drag the
// pinned node across the screen even though its world position never changes.
const physics = {
  on: false,
  raf: null,
  v: new Map(),        // id -> {x, y}
  still: 0,            // consecutive frames below the motion threshold
  camTarget: null,     // {x, y} centre of mass to follow
  speed: 0.9,          // px per step multiplier
  root: 0,             // css px per world unit (always 1 here)

  wake() {
    if (!state.physics) return;
    this.on = true;
    this.still = 0;
    if (this.raf) return;
    this.loop();
  },

  stop() {
    this.on = false;
    if (this.raf) { cancelAnimationFrame(this.raf); this.raf = null; }
  },

  vel(id) {
    let v = this.v.get(id);
    if (!v) { v = { x: 0, y: 0 }; this.v.set(id, v); }
    return v;
  },

  // a node the user is holding: pinned *and* dragged both mean "do not move it"
  held(n) {
    return !!n.pinned || (!!drag && drag.id === n.id);
  },

  // one integration step; returns the largest displacement this frame
  step() {
    const nodes = state.nodes;
    if (!nodes.length) return 0;
    let cx = 0, cy = 0;
    for (const n of nodes) { cx += n.x; cy += n.y; }
    cx /= nodes.length; cy /= nodes.length;

    const fx = new Map(), fy = new Map();
    for (const n of nodes) { fx.set(n.id, 0); fy.set(n.id, 0); }

    // gravity toward the centre of mass
    for (const n of nodes) {
      if (this.held(n)) continue;
      const g = numOrDefault(n.gravity, 1) * 0.012;
      if (!g) continue;
      fx.set(n.id, fx.get(n.id) + (cx - n.x) * g);
      fy.set(n.id, fy.get(n.id) + (cy - n.y) * g);
    }

    // pairwise repulsion, stronger when nodes overlap
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const ra = numOrDefault(a.repel, 1), rb = numOrDefault(b.repel, 1);
        const strength = (ra + rb) / 2;
        if (!strength) continue;
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy;
        const minD = R * 2.6;
        if (d2 < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 0.01; }
        const d = Math.sqrt(d2);
        // d^1.5 falloff instead of d^2 so higher repel values really push:
        // at d = 100, repel 1 -> ~1px/step, repel 10 -> ~10px/step.
        const push = Math.min(900, strength * 9000 / Math.max(Math.pow(d, 1.5), 240));
        if (d < minD) {
          // hard separation so labels never overlap
          const extra = (minD - d) * 0.22;
          const ux = dx / d, uy = dy / d;
          if (!this.held(a)) { fx.set(a.id, fx.get(a.id) - ux * (push + extra)); fy.set(a.id, fy.get(a.id) - uy * (push + extra)); }
          if (!this.held(b)) { fx.set(b.id, fx.get(b.id) + ux * (push + extra)); fy.set(b.id, fy.get(b.id) + uy * (push + extra)); }
        } else {
          const ux = dx / d, uy = dy / d;
          if (!this.held(a)) { fx.set(a.id, fx.get(a.id) - ux * push); fy.set(a.id, fy.get(a.id) - uy * push); }
          if (!this.held(b)) { fx.set(b.id, fx.get(b.id) + ux * push); fy.set(b.id, fy.get(b.id) + uy * push); }
        }
      }
    }

    // edges as springs (self-loops do not pull)
    const rest = R * 4.2;
    for (const e of state.edges) {
      if (e.from === e.to) continue;
      const a = nodeById(e.from), b = nodeById(e.to);
      if (!a || !b) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 1;
      const k = 0.010 * (d - rest) / d;
      const px = dx * k, py = dy * k;
      if (!this.held(a)) { fx.set(a.id, fx.get(a.id) + px); fy.set(a.id, fy.get(a.id) + py); }
      if (!this.held(b)) { fx.set(b.id, fx.get(b.id) - px); fy.set(b.id, fy.get(b.id) - py); }
    }

    let maxMove = 0;
    for (const n of nodes) {
      const vel = this.vel(n.id);
      if (this.held(n)) { vel.x = vel.y = 0; continue; }
      vel.x = (vel.x + fx.get(n.id)) * 0.82;
      vel.y = (vel.y + fy.get(n.id)) * 0.82;
      const sp = Math.hypot(vel.x, vel.y);
      if (sp > 14) { vel.x = vel.x / sp * 14; vel.y = vel.y / sp * 14; }
      n.x += vel.x * this.speed;
      n.y += vel.y * this.speed;
      maxMove = Math.max(maxMove, Math.hypot(vel.x, vel.y));
    }
    return maxMove;
  },

  // centre of mass of the whole graph (the camera's target)
  centre() {
    const nodes = state.nodes;
    if (!nodes.length) return null;
    let cx = 0, cy = 0;
    for (const n of nodes) { cx += n.x; cy += n.y; }
    return { x: cx / nodes.length, y: cy / nodes.length };
  },

  // The camera follows the centre of mass only while nothing is pinned: with a
  // pinned node on screen a pan would slide that node sideways, which is
  // exactly what "fixed" must not do.
  followCamera() {
    if (!state.nodes.length) return false;
    if (state.nodes.some(n => n.pinned)) return false;
    const c = this.centre();
    if (!c) return false;
    state.cam.x += (cw / 2 - c.x - state.cam.x) * 0.06;
    state.cam.y += (ch / 2 - c.y - state.cam.y) * 0.06;
    return true;
  },

  loop() {
    this.raf = requestAnimationFrame(() => {
      this.raf = null;
      if (!state.physics) { this.on = false; return; }
      const move = this.step();
      if (!drag) this.followCamera();
      // settle: stop when everything is basically still
      if (move < 0.06) this.still++;
      else this.still = 0;
      if (this.still > 45) {
        this.on = false;
        state.physics = false;
        syncControls();
        syncPhysicsToggle();
        scheduleSave();   // keep the settled layout
        return;
      }
      this.loop();
    });
  },

  // add a camera translation to a world point
  toScreen(p) {
    return { x: p.x + state.cam.x, y: p.y + state.cam.y };
  },
};

// ---------------------------------------------------------------- geometry
// Edges are quadratic curves, not straight lines. Every edge bows to its own
// left, so a pair a->b / b->a separates by itself without any extra offset.
// A self-loop is the same single quadratic as every other edge, just with both
// ends on the same node: it leaves the rim, bulges out, and comes back to the
// rim a little further round. No corner anywhere. It is aimed at the side of
// the node that has the fewest other edges instead of always sitting on top.
const LOOP_SPREAD = 0.62;    // radians between the two feet of a self-loop
const LOOP_GAP = 62;         // how far the bulge reaches past the rim
const ARROW_GAP = 10;        // distance the arrow tip stops short of the node

function angDiff(a, b) {
  let d = Math.abs(a - b) % (Math.PI * 2);
  return d > Math.PI ? Math.PI * 2 - d : d;
}

// direction (radians) around node n with the most free space
function freeAngle(n, e) {
  const used = [];
  for (const o of state.edges) {
    if (o.id === e.id) continue;
    const other = o.from === n.id ? nodeById(o.to) : (o.to === n.id ? nodeById(o.from) : null);
    if (other && other.id !== n.id) used.push(Math.atan2(other.y - n.y, other.x - n.x));
  }
  if (!used.length) return -Math.PI / 2;   // nothing else: top, the usual spot
  let best = -Math.PI / 2, bestGap = -1;
  for (let i = 0; i < 48; i++) {
    const ang = -Math.PI + (i / 48) * Math.PI * 2;
    let gap = Math.PI;
    for (const u of used) gap = Math.min(gap, angDiff(ang, u));
    if (gap > bestGap) { bestGap = gap; best = ang; }
  }
  return best;
}

function edgeGeom(e) {
  const a = nodeById(e.from), b = nodeById(e.to);
  if (!a || !b) return null;

  if (a.id === b.id) {
    const dir = freeAngle(a, e);
    // one quadratic, both feet on the rim; arrow foot is p1 (where the walk ends)
    const sx = a.x + Math.cos(dir - LOOP_SPREAD) * R;
    const sy = a.y + Math.sin(dir - LOOP_SPREAD) * R;
    const ex = a.x + Math.cos(dir + LOOP_SPREAD) * R;
    const ey = a.y + Math.sin(dir + LOOP_SPREAD) * R;
    // control point sits straight out along dir, far enough that the curve
    // bulges like a leaf instead of pinching into a point
    const cx = a.x + Math.cos(dir) * (R + LOOP_GAP * 2);
    const cy = a.y + Math.sin(dir) * (R + LOOP_GAP * 2);
    // the label goes outside the curve's own apex, never on top of the curve
    const apexR = Math.hypot((sx + 2 * cx + ex) / 4 - a.x, (sy + 2 * cy + ey) / 4 - a.y);
    return {
      loop: true, sx, sy, cx, cy, ex, ey,
      ax: ex, ay: ey, angle: Math.atan2(ey - cy, ex - cx),
      lx: a.x + Math.cos(dir) * (apexR + 26),
      ly: a.y + Math.sin(dir) * (apexR + 26),
    };
  }

  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;             // left normal of a->b
  const bow = clamp(len * 0.14, 12, 52);
  const mx = (a.x + b.x) / 2 + nx * bow * 2;
  const my = (a.y + b.y) / 2 + ny * bow * 2;
  const da = Math.hypot(mx - a.x, my - a.y) || 1;
  const db = Math.hypot(mx - b.x, my - b.y) || 1;
  const sx = a.x + (mx - a.x) / da * R, sy = a.y + (my - a.y) / da * R;
  const ex = b.x + (mx - b.x) / db * (R + ARROW_GAP), ey = b.y + (my - b.y) / db * (R + ARROW_GAP);
  // apex of the quadratic; the chip sits outside it, clear of the stroke
  const apexX = (sx + 2 * mx + ex) / 4, apexY = (sy + 2 * my + ey) / 4;
  const ox = apexX - (a.x + b.x) / 2, oy = apexY - (a.y + b.y) / 2;
  const ol = Math.hypot(ox, oy) || 1;
  return {
    loop: false, sx, sy, cx: mx, cy: my, ex, ey,
    angle: Math.atan2(ey - my, ex - mx),
    lx: apexX + ox / ol * 26, ly: apexY + oy / ol * 26,
  };
}

// flatten an edge into points, for hit testing
function edgePoints(g, steps = 24) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, u = 1 - t;
    pts.push({ x: u * u * g.sx + 2 * u * t * g.cx + t * t * g.ex,
               y: u * u * g.sy + 2 * u * t * g.cy + t * t * g.ey });
  }
  return pts;
}

function distToPolyline(px, py, pts) {
  let best = Infinity;
  for (let i = 1; i < pts.length; i++) {
    const d = distToSegment(px, py, pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y);
    if (d < best) best = d;
  }
  return best;
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function hitNode(p) {
  let best = null, bestD = R + 2;
  for (const n of state.nodes) {
    const d = Math.hypot(p.x - n.x, p.y - n.y);
    if (d < bestD) { bestD = d; best = n; }
  }
  return best;
}

const CHIP_HALF_W = 15, CHIP_HALF_H = 11;   // chip hit box, matches draw()
const chipDist = (p, g) =>
  Math.max(Math.abs(p.x - g.lx) - CHIP_HALF_W, Math.abs(p.y - g.ly) - CHIP_HALF_H, 0);

// A chip is a target in its own right; only when the pointer is on no chip do
// we look at the curves. Chips win ties because they are small and deliberate.
function hitEdge(p) {
  let best = null, bestD = Infinity;
  for (const e of state.edges) {
    const g = edgeGeom(e);
    if (!g) continue;
    const d = chipDist(p, g);
    // last one wins, because draw() paints the later edges on top
    if (d === 0 && d <= bestD) { bestD = d; best = e; }
  }
  if (best) return best;
  bestD = 13;
  for (const e of state.edges) {
    const g = edgeGeom(e);
    if (!g) continue;
    const d = distToPolyline(p.x, p.y, edgePoints(g));
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

// ---------------------------------------------------------------- render
function resize() {
  const rect = els.cv.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  cw = Math.max(1, rect.width);
  ch = Math.max(1, rect.height);
  els.cv.width = Math.round(cw * dpr);
  els.cv.height = Math.round(ch * dpr);
}

// ctx.roundRect with a square fallback for older engines
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  if (typeof ctx.roundRect === 'function') { ctx.roundRect(x, y, w, h, r); return; }
  const rr = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

// '#rrggbb' + alpha -> rgba()
function withAlpha(hex, a) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return 'rgba(255,255,255,' + a + ')';
  const v = parseInt(m[1], 16);
  return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${a})`;
}

// draw a node label sized to fit inside the circle
function drawFitText(ctx, text, x, y, maxW, maxSize) {
  text = String(text);
  let size = maxSize;
  do {
    ctx.font = size + "px 'Jua', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    if (ctx.measureText(text).width <= maxW) break;
    if (size > 9) { size--; continue; }
    if (text.length > 2) { text = text.slice(0, -2) + '…'; continue; }
    break;
  } while (true);
  ctx.fillText(text, x, y);
}

function draw(now) {
  const ctx = els.cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0e1116';
  ctx.fillRect(0, 0, cw, ch);
  ctx.translate(state.cam.x, state.cam.y);

  // dot grid
  ctx.fillStyle = '#161d26';
  for (let x = 16; x < cw; x += 32) {
    for (let y = 16; y < ch; y += 32) ctx.fillRect(x, y, 1, 1);
  }

  const sel = state.selection;

  // edges
  for (const e of state.edges) {
    const g = edgeGeom(e);
    if (!g) continue;
    const isSel = sel && sel.type === 'edge' && sel.id === e.id;
    ctx.strokeStyle = isSel ? EDGE_SEL : EDGE_COLOR;
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = isSel ? EDGE_W_SEL : EDGE_W;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(g.sx, g.sy);
    ctx.quadraticCurveTo(g.cx, g.cy, g.ex, g.ey);
    ctx.stroke();

    // arrow head
    const ax = g.ax !== undefined ? g.ax : g.ex;
    const ay = g.ay !== undefined ? g.ay : g.ey;
    const ang = g.angle;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - 11 * Math.cos(ang - 0.45), ay - 11 * Math.sin(ang - 0.45));
    ctx.lineTo(ax - 11 * Math.cos(ang + 0.45), ay - 11 * Math.sin(ang + 0.45));
    ctx.closePath();
    ctx.fill();

    // probability label
    const label = Math.round(edgeProbability(e) * 100) + '%';
    ctx.font = "13px 'Jua', ui-monospace, SFMono-Regular, Menlo, monospace";
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = '#0e1116';
    roundRect(ctx, g.lx - tw / 2 - 6, g.ly - 10, tw + 12, 20, 9);
    ctx.fill();
    ctx.fillStyle = isSel ? '#c9f6f4' : '#9aabc0';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, g.lx, g.ly);
  }

  // link preview
  if (linking) {
    const a = nodeById(linking.from);
    if (a) {
      ctx.strokeStyle = 'rgba(160,231,229,.7)';
      ctx.lineWidth = 2.4;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(linking.x, linking.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // playing highlights
  if (state.running) {
    for (const w of state.walkers) {
      if (!w.playingAt) continue;
      const n = nodeById(w.playingAt);
      if (!n) continue;
      const pulse = 1 + 0.06 * Math.sin(now / 130);
      ctx.beginPath();
      ctx.arc(n.x, n.y, (R + 7) * pulse, 0, Math.PI * 2);
      ctx.strokeStyle = w.color;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 2.4;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // nodes
  for (const n of state.nodes) {
    const isSel = sel && sel.type === 'node' && sel.id === n.id;
    ctx.beginPath();
    ctx.arc(n.x, n.y, R, 0, Math.PI * 2);
    ctx.fillStyle = n.color ? withAlpha(n.color, 0.2) : (n.audio ? '#1b2530' : '#161e28');
    ctx.fill();
    ctx.lineWidth = isSel ? 4 : (n.color ? 3 : 2.4);
    ctx.strokeStyle = isSel ? '#a0e7e5' : (n.color || '#3a4756');
    ctx.stroke();

    ctx.fillStyle = NODE_INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    drawFitText(ctx, n.label, n.x, n.y, R * 2 - 12, 16);

    if (n.audio) {
      ctx.beginPath();
      ctx.arc(n.x + R * 0.72, n.y - R * 0.72, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#101820';
      ctx.fill();
      ctx.strokeStyle = n.color || '#3a4a5c';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = n.color || '#8fdccd';
      ctx.font = '10px sans-serif';
      ctx.fillText('♪', n.x + R * 0.72, n.y - R * 0.7);
    }
  }

  // start-node marker
  if (state.startMode === 'selected' && state.startNodeId) {
    const sn = nodeById(state.startNodeId);
    if (sn) {
      ctx.beginPath();
      ctx.arc(sn.x, sn.y, R + 7, 0, Math.PI * 2);
      ctx.setLineDash([4, 5]);
      ctx.strokeStyle = '#a0e7e5';
      ctx.lineWidth = 2.2;
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // walker tokens
  const byNode = new Map();
  for (const w of state.walkers) {
    if (w.anim) continue;
    if (!byNode.has(w.nodeId)) byNode.set(w.nodeId, []);
    byNode.get(w.nodeId).push(w);
  }
  for (const [nid, list] of byNode) {
    const n = nodeById(nid);
    if (!n) continue;
    list.forEach((w, k) => {
      const ang = -Math.PI / 2 + (k / Math.max(list.length, 1)) * Math.PI * 2;
      drawToken(ctx, n.x + Math.cos(ang) * (R + 13), n.y + Math.sin(ang) * (R + 13), w);
    });
  }
  for (const w of state.walkers) {
    if (!w.anim) continue;
    const a = nodeById(w.anim.from.id), b = nodeById(w.anim.to.id);
    if (!a || !b) continue;
    const p = clamp((now - w.anim.t0) / w.anim.dur, 0, 1);
    const t = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    // follow the drawn edge: same quadratic the renderer uses
    const g = w.anim.geom || edgeGeom({ id: 'anim', from: a.id, to: b.id });
    let x, y;
    if (g && !g.loop) {
      const u = 1 - t;
      x = u * u * g.sx + 2 * u * t * g.cx + t * t * g.ex;
      y = u * u * g.sy + 2 * u * t * g.cy + t * t * g.ey;
    } else {
      x = a.x + (b.x - a.x) * t;
      y = a.y + (b.y - a.y) * t;
    }
    // started mid-slide (very short sound): ease from where the token was
    if (w.anim.fromPos) {
      x = w.anim.fromPos.x + (x - w.anim.fromPos.x) * t;
      y = w.anim.fromPos.y + (y - w.anim.fromPos.y) * t;
    }
    w.pos = { x, y };
    drawToken(ctx, x, y, w);
  }
}

function drawToken(ctx, x, y, w) {
  ctx.beginPath();
  ctx.arc(x, y, 10, 0, Math.PI * 2);
  ctx.fillStyle = w.color;
  ctx.fill();
  ctx.lineWidth = 2.4;
  ctx.strokeStyle = '#0b1014';
  ctx.stroke();
  ctx.fillStyle = '#0b1014';
  ctx.font = "12px 'Jua', ui-monospace, Menlo, monospace";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(w.i + 1), x, y + 0.5);
}

function frame(now) {
  draw(now);
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- context menu
const PALETTE = ['#a0e7e5','#a8c7fa','#ffd6a5','#ffb3c6','#d5c2f5','#c7f0a5','#a5e3f5','#ffe9a8'];
const NODE_INK = '#eef4fb';
const EDGE_COLOR = '#5f7288';
const EDGE_SEL = '#a0e7e5';
const EDGE_W = 2.4;           // resting stroke width (thicker = pastel sticker look)
const EDGE_W_SEL = 3.6;

function setSelection(sel) {
  state.selection = sel;
}

function closeMenu() {
  const m = els.menu;
  if (!m) return;
  m.classList.remove('show');
  m.innerHTML = '';
  menuOpen = null;
}

function openMenu(kind, id, clientX, clientY) {
  const m = els.menu;
  if (!m) return;
  menuOpen = { kind, id };
  m.innerHTML = kind === 'node' ? nodeMenuHtml(nodeById(id))
    : kind === 'bg' ? bgMenuHtml()
    : edgeMenuHtml(edgeById(id));
  m.classList.add('show');
  // keep the menu on screen
  const r = m.getBoundingClientRect();
  const x = Math.min(clientX, window.innerWidth - r.width - 8);
  const y = Math.min(clientY, window.innerHeight - r.height - 8);
  m.style.left = Math.max(8, x) + 'px';
  m.style.top = Math.max(8, y) + 'px';
  if (kind === 'node') bindNodeMenu(nodeById(id));
  else if (kind === 'bg') bindBgMenu();
  else bindEdgeMenu(edgeById(id));
}

function nodeMenuHtml(n) {
  if (!n) return '';
  const isStart = state.startMode === 'selected' && state.startNodeId === n.id;
  const swatches = PALETTE.map(c =>
    `<button class="sw${n.color === c ? ' on' : ''}" data-color="${c}" style="background:${c}" title="${c}"></button>`
  ).join('');
  return `
    <div class="title">${esc(n.label)}${n.audio ? ' · ♪' : ''}</div>
    <button data-act="rename">이름 바꾸기<span class="key">F2</span></button>
    ${n.audio ? '<button data-act="sound">소리 바꾸기</button>' : '<button data-act="sound">소리 넣기</button>'}
    ${n.audio ? '<button data-act="preview">미리 듣기</button>' : ''}
    ${n.audio ? '<button data-act="clearsound">소리 제거</button>' : ''}
    <div class="title" style="border:0;margin:4px 0 2px;padding-bottom:2px">색</div>
    <div class="swatches">${swatches}</div>
    <div class="title" style="border:0;margin:4px 0 2px;padding-bottom:2px">중력</div>
    <div class="slider"><div class="lab"><span>gravity</span><b>${numOrDefault(n.gravity, 1).toFixed(1)}</b></div>
      <input type="range" min="0" max="3" step="0.1" value="${numOrDefault(n.gravity, 1)}" data-slider="gravity"></div>
    <div class="slider"><div class="lab"><span>repel</span><b>${numOrDefault(n.repel, 1).toFixed(1)}</b></div>
      <input type="range" min="0" max="${REPEL_MAX}" step="0.1" value="${numOrDefault(n.repel, 1)}" data-slider="repel"></div>
    <button data-act="pin">${n.pinned ? '✓ 중력 무시 (고정)' : '중력 무시 (고정)'}</button>
    <button data-act="start">${isStart ? '✓ 시작 노드' : '여기서 시작'}</button>
    <button data-act="delete" class="danger">노드 삭제<span class="key">Del</span></button>
  `;
}

function bindNodeMenu(n) {
  if (!n) return;
  const m = els.menu;
  m.querySelectorAll('[data-act]').forEach(b => {
    b.onclick = () => {
      const act = b.dataset.act;
      closeMenu();
      if (act === 'rename') startRename(n, { left: parseFloat(m.style.left), top: parseFloat(m.style.top) });
      else if (act === 'sound') pickSound(n);
      else if (act === 'preview') previewSound(n);
      else if (act === 'clearsound') { n.audio = null; scheduleSave(); toast('소리 제거: ' + n.label); }
      else if (act === 'start') {
        state.startMode = 'selected';
        state.startNodeId = n.id;
        scheduleSave();
        toast('시작 노드: ' + n.label);
      } else if (act === 'delete') deleteNode(n.id);
    };
  });
  m.querySelectorAll('[data-color]').forEach(b => {
    b.onclick = () => {
      n.color = b.dataset.color;
      scheduleSave();
      openMenu('node', n.id, parseFloat(m.style.left), parseFloat(m.style.top));
    };
  });
  m.querySelectorAll('[data-slider]').forEach(input => {
    input.oninput = () => {
      const key = input.dataset.slider;
      n[key] = clamp(round1(Number(input.value) || 0), 0, key === 'repel' ? REPEL_MAX : 3);
      const lab = input.parentElement.querySelector('.lab b');
      if (lab) lab.textContent = n[key].toFixed(1);
      if (state.physics) physics.wake();
      scheduleSave();
    };
  });
  const pin = m.querySelector('[data-act=pin]');
  if (pin) {
    pin.onclick = () => {
      n.pinned = !n.pinned;
      if (n.pinned) {
        const vel = physics.v.get(n.id);
        if (vel) { vel.x = 0; vel.y = 0; }
      }
      scheduleSave();
      openMenu('node', n.id, parseFloat(m.style.left), parseFloat(m.style.top));
    };
  }
}

function bgMenuHtml() {
  const nodes = state.nodes.length;
  return `
    <div class="title">그래프${nodes ? ' · 노드 ' + nodes : ''}</div>
    <button data-act="add">노드 추가</button>
    <div class="title" style="border:0;margin:4px 0 2px;padding-bottom:2px">워커</div>
    <div class="rowline">
      <input type="number" id="bgWorkers" min="1" max="9" step="1" value="${state.walkerCount}">
      <span>명</span>
      <button class="ghost" data-act="bugo">−</button>
      <button class="ghost" data-act="wup">+</button>
    </div>
    <div class="title" style="border:0;margin:4px 0 2px;padding-bottom:2px">시작</div>
    <div class="seg">
      <button data-act="mode-random" class="${state.startMode === 'random' ? 'on' : ''}">랜덤</button>
      <button data-act="mode-selected" class="${state.startMode === 'selected' ? 'on' : ''}">정해진 노드</button>
    </div>
    <div class="title" style="border:0;margin:4px 0 2px;padding-bottom:2px">소리 사이 딜레이</div>
    <div class="slider"><div class="lab"><span>쉼</span><b>${state.delay.toFixed(2)}초</b></div>
      <input type="range" min="0" max="${DELAY_MAX}" step="0.05" value="${state.delay}" data-delay></div>
    <button data-act="physics" class="${state.physics ? 'on' : ''}">${state.physics ? '✓ 중력' : '중력'}</button>
    <div class="title" style="border:0;margin:4px 0 2px;padding-bottom:2px">파일</div>
    <button data-act="export">파일로 저장</button>
    <button data-act="import">불러오기</button>
    <button data-act="clear" class="danger">비우기</button>
  `;
}

function bindBgMenu() {
  const m = els.menu;
  const workers = m.querySelector('#bgWorkers');
  const setWorkers = (v) => {
    const next = clamp(Math.round(v) || 1, 1, 9);
    if (next === state.walkerCount) { workers.value = String(state.walkerCount); return; }
    state.walkerCount = next;
    workers.value = String(next);
    if (state.running) toast('워커 수는 다음 시작부터 적용됩니다');
    scheduleSave();
  };
  workers.oninput = () => setWorkers(Number(workers.value));
  workers.onchange = () => { workers.value = String(state.walkerCount); };
  m.querySelector('[data-act=wup]').onclick = () => setWorkers(state.walkerCount + 1);
  m.querySelector('[data-act=bugo]').onclick = () => setWorkers(state.walkerCount - 1);
  const delayIn = m.querySelector('input[data-delay]');
  if (delayIn) {
    delayIn.oninput = () => {
      state.delay = clamp(Math.round((Number(delayIn.value) || 0) * 100) / 100, 0, DELAY_MAX);
      const lab = delayIn.parentElement.querySelector('.lab b');
      if (lab) lab.textContent = state.delay.toFixed(2) + '초';
      scheduleSave();
    };
  }
  m.querySelectorAll('[data-act]').forEach(b => {
    const act = b.dataset.act;
    if (act === 'wup' || act === 'bugo') return;
    b.onclick = () => {
      const at = { left: parseFloat(m.style.left), top: parseFloat(m.style.top) };
      if (act === 'add') { closeMenu(); addNodeCentered(); }
      else if (act === 'mode-random' || act === 'mode-selected') {
        setStartMode(act === 'mode-selected' ? 'selected' : 'random');
        openMenu('bg', null, at.left, at.top);
      } else if (act === 'physics') {
        state.physics = !state.physics;
        if (state.physics) physics.wake(); else physics.stop();
        syncPhysicsToggle();
        scheduleSave();
        openMenu('bg', null, at.left, at.top);
      } else if (act === 'export') { closeMenu(); exportFile(); }
      else if (act === 'import') { closeMenu(); els.importFile.value = ''; els.importFile.click(); }
      else if (act === 'clear') { closeMenu(); clearGraph(); }
    };
  });
}

function edgeMenuHtml(e) {
  if (!e) return '';
  const a = nodeById(e.from), b = nodeById(e.to);
  const names = e.from === e.to ? a ? esc(a.label) + ' ↻' : '' : `${esc(a ? a.label : e.from)} → ${esc(b ? b.label : e.to)}`;
  const locked = outEdges(e.from).length <= 1;
  const pct = edgePct(e);
  return `
    <div class="title">${names}</div>
    <div class="slider">
      <div class="lab"><span>확률</span><b>${pct}%</b></div>
      <input type="range" min="0" max="100" step="1" value="${Math.round(pct)}" data-pct${locked ? ' disabled' : ''}>
    </div>
    ${locked ? '<div class="num" style="padding-top:0">나가는 연결이 하나뿐이라 100% 고정입니다</div>' : ''}
    <div class="num" style="padding-top:0">나머지는 기존 비율대로 100%를 나눕니다 · 휠로도 조절</div>
    <button data-act="delete" class="danger">연결 삭제<span class="key">Del</span></button>
  `;
}

function bindEdgeMenu(e) {
  if (!e) return;
  const m = els.menu;
  const slider = m.querySelector('input[data-pct]');
  if (slider) {
    slider.oninput = () => {
      setEdgeWeight(e, Number(slider.value) || 0);
      const lab = m.querySelector('.lab b');
      if (lab) lab.textContent = edgePct(e) + '%';
      scheduleSave();
    };
    slider.onchange = () => {
      slider.value = String(Math.round(edgePct(e)));
      const lab = m.querySelector('.lab b');
      if (lab) lab.textContent = edgePct(e) + '%';
    };
  }
  m.querySelector('[data-act=delete]').onclick = () => { closeMenu(); deleteEdge(e.id); };
}

function renameNode(n, value) {
  const label = String(value || '').trim();
  if (!label) return false;
  n.label = label.slice(0, 40);
  scheduleSave();
  return true;
}

function startRename(n, anchor) {
  if (!n) return;
  const m = els.menu;
  const rect = anchor && anchor.left != null
    ? { left: anchor.left, top: anchor.top }
    : { left: parseFloat(m.style.left) || 40, top: parseFloat(m.style.top) || 40 };
  menuOpen = { kind: 'node', id: n.id };
  m.innerHTML = `
    <div class="title">이름 바꾸기</div>
    <div class="num"><input id="menuRename" type="text" maxlength="40" value="${esc(n.label)}"></div>
  `;
  const input = m.querySelector('#menuRename');
  input.style.width = '200px';
  m.classList.add('show');
  m.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - m.offsetWidth - 8)) + 'px';
  m.style.top = Math.max(8, Math.min(rect.top, window.innerHeight - m.offsetHeight - 8)) + 'px';
  input.focus();
  input.select();
  let done = false;
  const commit = (save) => {
    if (done) return;
    done = true;
    if (save && renameNode(n, input.value)) toast('이름 변경: ' + n.label);
    closeMenu();
  };
  input.onkeydown = (ev2) => {
    ev2.stopPropagation();
    if (ev2.key === 'Enter') { ev2.preventDefault(); commit(true); }
    else if (ev2.key === 'Escape') { ev2.preventDefault(); commit(false); }
  };
  input.onblur = () => commit(true);
}

function pickSound(n) {
  if (!n) return;
  els.soundFile.value = '';
  soundTargetId = n.id;
  els.soundFile.click();
}

// ---------------------------------------------------------------- sound files
async function previewSound(n) {
  try {
    await audio.resume();
    const buf = await audio.buffer(n);
    if (buf) await audio.play(buf);
  } catch (e) {
    toast('소리를 재생할 수 없습니다: ' + (n.audio ? n.audio.name : ''));
  }
}

const MAX_AUDIO_BYTES = 8 * 1024 * 1024;

function onSoundFile(file, targetId) {
  const id = targetId || soundTargetId;
  soundTargetId = null;   // one-shot: never leak to the next change event
  const n = id ? nodeById(id) : null;
  if (!n || !file) return;
  if (file.size > MAX_AUDIO_BYTES) {
    toast('소리 파일이 너무 큽니다 (8MB 이하) — 짧은 클립을 쓰세요');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    n.audio = { name: file.name, mime: file.type || '', data: String(reader.result) };
    scheduleSave();
    toast('소리 지정: ' + file.name);
  };
  reader.onerror = () => toast('파일을 읽지 못했습니다');
  reader.readAsDataURL(file);
}

// ---------------------------------------------------------------- io
function exportFile() {
  const blob = new Blob([serializeGraph()], { type: 'application/json' });
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  a.href = URL.createObjectURL(blob);
  a.download = 'markov-sound-graph-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('그래프와 소리를 파일로 저장했습니다');
}

async function importFile(file) {
  if (!file) return;
  let text;
  try {
    text = await file.text();
  } catch (e) {
    toast('파일을 읽지 못했습니다');
    return;
  }
  let g;
  try {
    g = deserializeGraph(text);
  } catch (e) {
    toast('불러오기 실패: ' + e.message);
    return;
  }
  if (state.nodes.length && !confirm('현재 그래프를 불러온 파일로 대체합니다. 계속할까요?')) return;
  applyGraph(g);
  scheduleSave();
  toast(`불러왔습니다 — 노드 ${g.nodes.length}개, 연결 ${g.edges.length}개`);
}

// ---------------------------------------------------------------- ui helpers
let toastTimer = null;
function toast(msg) {
  const t = els.toast;
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

const ICON_PLAY = 'M8 5.5v13a1 1 0 0 0 1.54.84l10-6.5a1 1 0 0 0 0-1.68l-10-6.5A1 1 0 0 0 8 5.5z';
const ICON_STOP = 'M7 6.5h10a.5.5 0 0 1 .5.5v10a.5.5 0 0 1-.5.5H7a.5.5 0 0 1-.5-.5V7a.5.5 0 0 1 .5-.5z';

function syncControls() {
  const b = els.run;
  if (!b) return;
  b.classList.toggle('running', state.running);
  b.setAttribute('aria-label', state.running ? '정지' : '시작');
  b.title = state.running ? '정지 (Space)' : '시작 (Space)';
  const icon = b.querySelector('path');
  if (icon) icon.setAttribute('d', state.running ? ICON_STOP : ICON_PLAY);
}

function syncPhysicsToggle() {
  // the menu is the only place the toggle lives; repaint if it is open
  if (menuOpen && menuOpen.kind === 'bg') {
    const b = els.menu.querySelector('[data-act=physics]');
    if (b) {
      b.classList.toggle('on', state.physics);
      b.textContent = state.physics ? '✓ 중력' : '중력';
    }
  }
}

function setStartMode(mode) {
  state.startMode = mode === 'selected' ? 'selected' : 'random';
  if (state.startMode === 'selected') {
    const n = state.startNodeId ? nodeById(state.startNodeId) : null;
    toast(n ? '시작 노드: ' + n.label : '노드를 우클릭해 "여기서 시작"을 고르세요');
  }
  scheduleSave();
}

function addNodeCentered() {
  const x = clamp(cw / 2 - state.cam.x + (Math.random() - 0.5) * cw * 0.35, R, Math.max(R, cw - R));
  const y = clamp(ch / 2 - state.cam.y + (Math.random() - 0.5) * ch * 0.35, R, Math.max(R, ch - R));
  const n = addNodeAt(x, y);
  setSelection({ type: 'node', id: n.id });
  physics.wake();
  scheduleSave();
}

function clearGraph() {
  if (!state.nodes.length) return;
  if (!confirm('그래프와 소리를 모두 지웁니다. 계속할까요?')) return;
  stopWalkers();
  state.nodes = [];
  state.edges = [];
  state.selection = null;
  state.startNodeId = null;
  state.cam.x = 0;
  state.cam.y = 0;
  closeMenu();
  scheduleSave();
  toast('새 그래프를 시작합니다');
}

const edgeByPair = (from, to) =>
  state.edges.find(e => e.from === from && e.to === to) || null;

function seedDemo() {
  const base = { x: 190, y: 220 };
  const n1 = addNodeAt(base.x, base.y, 'N1');
  const n2 = addNodeAt(base.x + 240, base.y - 70, 'N2');
  const n3 = addNodeAt(base.x + 470, base.y + 30, 'N3');
  const n4 = addNodeAt(base.x + 250, base.y + 200, 'N4');
  addEdge(n1.id, n2.id);
  addEdge(n1.id, n3.id);
  addEdge(n2.id, n3.id);
  addEdge(n2.id, n1.id);
  addEdge(n3.id, n4.id);
  addEdge(n3.id, n2.id);
  addEdge(n4.id, n1.id);
  addEdge(n4.id, n4.id);
  // set weights only after every edge exists: a lone outgoing edge is locked
  // at 100 and would swallow an earlier nudge
  const bias = [[n1.id, n2.id, 65], [n2.id, n3.id, 70], [n3.id, n4.id, 60], [n4.id, n1.id, 80]];
  for (const [from, to, pct] of bias) {
    const e = edgeByPair(from, to);
    if (e) setEdgeWeight(e, pct);
  }
}

// ---------------------------------------------------------------- events
function bindUI() {
  els.cv.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0) return;   // right/middle click is for the context menu
    const p = toGraph(ev);
    const n = hitNode(p);
    if (ev.shiftKey && n) {
      linking = { from: n.id, x: p.x, y: p.y };
      capture(ev);
      return;
    }
    if (n) {
      drag = { kind: 'node', id: n.id, ox: p.x - n.x, oy: p.y - n.y };
      setSelection({ type: 'node', id: n.id });
      capture(ev);
      return;
    }
    const e = hitEdge(p);
    if (e) { setSelection({ type: 'edge', id: e.id }); return; }
    setSelection(null);
  });

  els.cv.addEventListener('pointermove', (ev) => {
    const p = toGraph(ev);
    if (linking) { linking.x = p.x; linking.y = p.y; return; }
    if (drag) {
      const n = nodeById(drag.id);
      if (!n) return;
      // keep the node grabbable inside the visible canvas (world coords)
      const wx0 = -state.cam.x + R, wx1 = -state.cam.x + Math.max(R, cw - R);
      const wy0 = -state.cam.y + R, wy1 = -state.cam.y + Math.max(R, ch - R);
      n.x = clamp(p.x - drag.ox, wx0, wx1);
      n.y = clamp(p.y - drag.oy, wy0, wy1);
      scheduleSave();
    }
  });

  els.cv.addEventListener('pointerup', (ev) => {
    const p = toGraph(ev);
    if (linking) {
      const t = hitNode(p);
      if (t) {   // dropping on the origin node creates a self-loop
        const e = addEdge(linking.from, t.id);
        setSelection({ type: 'edge', id: e.id });
        scheduleSave();
      }
      linking = null;
      return;
    }
    if (drag) { drag = null; physics.wake(); }
  });

  els.cv.addEventListener('pointercancel', () => { drag = null; linking = null; });

  // double click: node = pick its sound, empty canvas = new node
  els.cv.addEventListener('dblclick', (ev) => {
    const p = toGraph(ev);
    const n = hitNode(p);
    if (n) {
      setSelection({ type: 'node', id: n.id });
      pickSound(n);
      return;
    }
    if (hitEdge(p)) return;
    const fresh = addNodeAt(p.x, p.y);
    setSelection({ type: 'node', id: fresh.id });
    scheduleSave();
  });

  // right click: node / edge menu
  els.cv.addEventListener('contextmenu', (ev) => {
    ev.preventDefault();
    const p = toGraph(ev);
    const n = hitNode(p);
    if (n) {
      setSelection({ type: 'node', id: n.id });
      openMenu('node', n.id, ev.clientX, ev.clientY);
      return;
    }
    const e = hitEdge(p);
    if (e) {
      setSelection({ type: 'edge', id: e.id });
      openMenu('edge', e.id, ev.clientX, ev.clientY);
      return;
    }
    setSelection(null);
    openMenu('bg', null, ev.clientX, ev.clientY);
  });

  // wheel over an edge nudges its probability by 1% (Shift = 10%)
  els.cv.addEventListener('wheel', (ev) => {
    const p = toGraph(ev);
    const e = hitEdge(p) || (menuOpen && menuOpen.kind === 'edge' ? edgeById(menuOpen.id) : null);
    if (!e) return;
    ev.preventDefault();
    const outs = outEdges(e.from);
    if (outs.length <= 1) {
      toast('나가는 연결이 하나뿐이라 100% 고정입니다');
      return;
    }
    const step = ev.shiftKey ? 10 : 1;
    const dir = ev.deltaY > 0 ? -1 : 1;
    setEdgeWeight(e, round1(e.weight + dir * step));
    setSelection({ type: 'edge', id: e.id });
    if (menuOpen && menuOpen.kind === 'edge' && menuOpen.id === e.id) {
      // keep the open edge menu's slider in sync with the wheel
      const slider = els.menu.querySelector('input[data-pct]');
      if (slider) slider.value = String(Math.round(edgePct(e)));
      const lab = els.menu.querySelector('.lab b');
      if (lab) lab.textContent = edgePct(e) + '%';
    }
    toast(`이 간선 ${edgePct(e)}%`);
    physics.wake();
    scheduleSave();
  }, { passive: false });

  // dismiss the menu
  document.addEventListener('pointerdown', (ev) => {
    if (!menuOpen) return;
    if (els.menu.contains(ev.target)) return;
    closeMenu();
  }, true);
  window.addEventListener('blur', closeMenu);
  window.addEventListener('resize', closeMenu);
  document.addEventListener('scroll', closeMenu, true);

  window.addEventListener('keydown', (ev) => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON') return;
    if (ev.key === 'Delete' || ev.key === 'Backspace') {
      if (state.selection) { ev.preventDefault(); deleteSelection(); }
    } else if (ev.key === 'Escape') {
      if (menuOpen) { closeMenu(); return; }
      linking = null;
      setSelection(null);
    } else if (ev.key === 'F2') {
      const s2 = state.selection;
      if (s2 && s2.type === 'node') {
        const n = nodeById(s2.id);
        if (n) {
          ev.preventDefault();
          const rect = els.cv.getBoundingClientRect();
          startRename(n, { left: rect.left + n.x, top: rect.top + n.y });
        }
      }
    } else if (ev.key === ' ') {
      ev.preventDefault();
      if (state.running) stopWalkers(); else startWalkers();
    }
  });

  els.run.addEventListener('click', () => {
    if (state.running) stopWalkers(); else startWalkers();
  });

  els.soundFile.addEventListener('change', () => {
    const file = els.soundFile.files[0];
    els.soundFile.value = '';
    onSoundFile(file);
  });

  els.cv.addEventListener('dragover', (ev) => {
    if (ev.dataTransfer && Array.from(ev.dataTransfer.types).includes('Files')) {
      ev.preventDefault();
      ev.dataTransfer.dropEffect = 'copy';
    }
  });
  els.cv.addEventListener('drop', (ev) => {
    const file = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (!file) return;
    ev.preventDefault();
    const n = hitNode(toGraph(ev));
    if (!n) { toast('소리를 넣을 노드 위에 떨어뜨리세요'); return; }
    setSelection({ type: 'node', id: n.id });
    onSoundFile(file, n.id);
  });
  els.importFile.addEventListener('change', () => importFile(els.importFile.files[0]));

  const flush = () => { if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; saveNow(); } };
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

  new ResizeObserver(resize).observe(els.cv);
}

function capture(ev) {
  try { els.cv.setPointerCapture(ev.pointerId); } catch (e) { /* synthetic pointer */ }
}

function toGraph(ev) {
  const r = els.cv.getBoundingClientRect();
  return { x: ev.clientX - r.left - state.cam.x, y: ev.clientY - r.top - state.cam.y };
}

// screen-space position of a world point
function toScreen(n) {
  return { x: n.x + state.cam.x, y: n.y + state.cam.y };
}

// ---------------------------------------------------------------- self test
function runSelfTests() {
  const out = [];
  let fails = 0;
  const check = (name, fn) => {
    try {
      const ok = fn() === true;
      if (!ok) fails++;
      out.push((ok ? 'PASS  ' : 'FAIL  ') + name);
    } catch (e) {
      fails++;
      out.push('FAIL  ' + name + '  (' + e.message + ')');
    }
  };

  const E = [
    { id: 'e1', from: 'a', to: 'b', weight: 1 },
    { id: 'e2', from: 'a', to: 'c', weight: 3 },
    { id: 'e3', from: 'a', to: 'a', weight: 0 },
  ];

  check('weight boundary: rng=0 -> first edge', () => nextEdgeFrom(E, 'a', () => 0).id === 'e1');
  check('weight boundary: rng~1 -> last positive edge', () => nextEdgeFrom(E, 'a', () => 0.999999).id === 'e2');
  check('zero weight never chosen', () => {
    for (let i = 0; i < 2000; i++) if (nextEdgeFrom(E, 'a').id === 'e3') return false;
    return true;
  });
  check('dead end -> null', () => nextEdgeFrom(E, 'zzz') === null);
  check('distribution ~25/75', () => {
    let b = 0;
    const N = 20000;
    for (let i = 0; i < N; i++) if (nextEdgeFrom(E, 'a').id === 'e1') b++;
    const r = b / N;
    return r > 0.22 && r < 0.28;
  });
  check('serialize/deserialize round trip', () => {
    const g = {
      walkerCount: 5, physics: true,
      nodes: [
        { id: 'a', x: 10, y: 20, label: 'A', gravity: 0.5, repel: 2, pinned: true, audio: { name: 'a.wav', mime: 'audio/wav', data: 'data:audio/wav;base64,AAAA' } },
        { id: 'b', x: 30, y: 40, label: 'B', audio: null },
      ],
      edges: [{ id: 'e1', from: 'a', to: 'b', weight: 70 }, { id: 'e2', from: 'b', to: 'b', weight: 100 }],
    };
    const r = deserializeGraph(serializeGraph(g));
    return r.nodes.length === 2 && r.edges.length === 2 && r.walkerCount === 5 &&
      r.physics === true &&
      r.nodes[0].audio.data === g.nodes[0].audio.data &&
      r.nodes[1].audio === null &&
      r.nodes[0].gravity === 0.5 && r.nodes[0].repel === 2 && r.nodes[0].pinned === true &&
      r.nodes[1].gravity === 1 && r.nodes[1].pinned === false &&
      r.edges[0].weight === 100 && r.edges[1].from === 'b' && r.edges[1].to === 'b';
  });
  // helpers for the percent model: build an isolated 3-edge node
  const withFan = (weights, fn) => {
    const savedN = state.nodes, savedE = state.edges, savedSel = state.selection;
    state.nodes = [
      { id: 'f', x: 0, y: 0, label: 'F', audio: null, color: null, gravity: 1, repel: 1, pinned: false },
      { id: 'x', x: 100, y: 0, label: 'X', audio: null, color: null, gravity: 1, repel: 1, pinned: false },
      { id: 'y', x: 0, y: 100, label: 'Y', audio: null, color: null, gravity: 1, repel: 1, pinned: false },
      { id: 'z', x: -100, y: 0, label: 'Z', audio: null, color: null, gravity: 1, repel: 1, pinned: false },
    ];
    state.edges = weights.map((w, i) => ({ id: 'w' + i, from: 'f', to: ['x', 'y', 'z'][i], weight: w }));
    let res;
    try { res = fn(); } finally {
      state.nodes = savedN; state.edges = savedE; state.selection = savedSel;
    }
    return res;
  };
  const sumOf = (fromId) => Math.round(outEdges(fromId).reduce((a, e) => a + e.weight, 0) * 10) / 10;

  check('outgoing percentages always sum to 100', () =>
    withFan([10, 10, 80], () => {
      const e = state.edges[0];
      setEdgeWeight(e, 50);
      setEdgeWeight(state.edges[1], 0);
      setEdgeWeight(state.edges[2], 100);
      setEdgeWeight(state.edges[2], 3.3);
      return sumOf('f') === 100;
    }));

  check('nudging one edge redistributes the rest by ratio', () =>
    withFan([10, 10, 80], () => {
      setEdgeWeight(state.edges[0], 20);
      const [a, b, c] = state.edges.map(e => e.weight);
      // the other two keep their 1:8 ratio over the remaining 80
      return a === 20 && Math.abs(b - 80 * (1 / 9)) < 0.11 && Math.abs(c - 80 * (8 / 9)) < 0.11;
    }));

  check('reaching 100 zeroes the rest and remembers the ratio', () =>
    withFan([10, 10, 80], () => {
      const e = state.edges[0];
      setEdgeWeight(e, 100);
      const atMax = state.edges.map(x => x.weight);
      setEdgeWeight(e, 50);   // comes back down: old 1:8 ratio restored
      const back = state.edges.map(x => x.weight);
      return atMax[0] === 100 && atMax[1] === 0 && atMax[2] === 0 &&
        back[0] === 50 && Math.abs(back[1] - 50 / 9) < 0.11 && Math.abs(back[2] - 50 * 8 / 9) < 0.11;
    }));

  check('new edge takes 100/n, siblings keep their ratio', () =>
    withFan([100], () => {
      addEdge('f', 'y');
      const ws = outEdges('f').map(e => e.weight).sort((a, b) => a - b);
      return ws[0] === 50 && ws[1] === 50 && sumOf('f') === 100;
    }));

  check('third edge splits 100/3 then rebalances', () =>
    withFan([100], () => {
      addEdge('f', 'y');
      addEdge('f', 'z');
      const ws = outEdges('f').map(e => e.weight);
      return ws.length === 3 && ws.every(w => Math.abs(w - 100 / 3) < 0.11) && sumOf('f') === 100;
    }));

  check('addEdge is idempotent for the same pair', () =>
    withFan([100], () => {
      const before = outEdges('f').length;
      addEdge('f', 'x');
      return outEdges('f').length === before;
    }));

  check('deleting an edge renormalizes to 100', () =>
    withFan([25, 25, 50], () => {
      deleteEdge('w1');
      return sumOf('f') === 100 && outEdges('f').length === 2;
    }));

  // the sum-100 invariant means a node with edges can never be fully zeroed;
  // the last removal spreads 100 back over the rest, so there is always a way out
  check('zeroing every edge keeps the 100 invariant and a pickable next', () =>
    withFan([34, 33, 33], () => {
      for (const e of outEdges('f')) setEdgeWeight(e, 0);
      // the last zeroing has no ratio left to scale, so it splits the 100 evenly
      const ws = outEdges('f').map(e => e.weight).sort((a, b) => a - b);
      return sumOf('f') === 100 && pickNext('f') !== null && ws[2] > 0;
    }));

  check('single outgoing edge is pinned at 100', () =>
    withFan([100], () => {
      const e = state.edges[0];
      setEdgeWeight(e, 20);
      return e.weight === 100;
    }));

  check('wheel-style nudges stay inside 0..100', () =>
    withFan([50, 50], () => {
      const e = state.edges[0];
      for (let i = 0; i < 200; i++) setEdgeWeight(e, e.weight + 1);
      const hi = e.weight;
      for (let i = 0; i < 400; i++) setEdgeWeight(e, e.weight - 1);
      return hi === 100 && e.weight === 0 && sumOf('f') === 100;
    }));

  check('deserialize converts legacy absolute weights to percentages', () => {
    const r = deserializeGraph(JSON.stringify({
      nodes: [{ id: 'a', label: 'A' }, { id: 'b', label: 'B' }, { id: 'c', label: 'C' }],
      edges: [{ from: 'a', to: 'b', weight: 3 }, { from: 'a', to: 'c', weight: 1 }],
    }));
    const out = r.edges.filter(e => e.from === 'a').map(e => e.weight).sort((x, y) => x - y);
    return out[0] === 25 && out[1] === 75;
  });

  check('deserialize drops dangling edges', () => {
    const r = deserializeGraph(JSON.stringify({
      nodes: [{ id: 'a', label: 'A' }],
      edges: [{ from: 'a', to: 'ghost', weight: 1 }, { from: 'a', to: 'a', weight: 1 }],
    }));
    return r.edges.length === 1 && r.edges[0].to === 'a';
  });
  check('deserialize rejects bad input', () => {
    let threw = false;
    try { deserializeGraph('{"nodes":5}'); } catch (e) { threw = true; }
    return threw;
  });
  // ---- edge geometry: curves and teardrop self-loops
  const withNodes = (nodes, edges, fn) => {
    const savedN = state.nodes, savedE = state.edges;
    state.nodes = nodes; state.edges = edges;
    try { return fn(); } finally { state.nodes = savedN; state.edges = savedE; }
  };
  const mkNode = (id, x, y) => ({ id, x, y, label: id, color: null, gravity: 1, repel: 1, pinned: false, audio: null });

  check('edges are curves, not straight lines', () =>
    withNodes([mkNode('a', 0, 0), mkNode('b', 400, 0)],
      [{ id: 'e', from: 'a', to: 'b', weight: 100 }], () => {
        const g = edgeGeom(state.edges[0]);
        // a straight line would have its control point on the chord
        return g && !g.loop && Math.abs(g.cy) > 20 && Math.abs(g.cx - 200) < 1;
      }));

  check('opposite edges bow to different sides', () =>
    withNodes([mkNode('a', 0, 0), mkNode('b', 400, 0)],
      [{ id: 'e1', from: 'a', to: 'b', weight: 100 }, { id: 'e2', from: 'b', to: 'a', weight: 100 }], () => {
        const g1 = edgeGeom(state.edges[0]), g2 = edgeGeom(state.edges[1]);
        return Math.sign(g1.cy) !== Math.sign(g2.cy);
      }));

  check('curve endpoints sit on the two node rims', () =>
    withNodes([mkNode('a', 0, 0), mkNode('b', 300, 120)],
      [{ id: 'e', from: 'a', to: 'b', weight: 100 }], () => {
        const g = edgeGeom(state.edges[0]);
        const a = nodeById('a'), b = nodeById('b');
        const dStart = Math.hypot(g.sx - a.x, g.sy - a.y);
        const dEnd = Math.hypot(g.ex - b.x, g.ey - b.y);
        return Math.abs(dStart - R) < 0.001 && Math.abs(dEnd - (R + ARROW_GAP)) < 0.001;
      }));

  check('self-loop is one smooth quadratic, both feet on the rim', () =>
    withNodes([mkNode('a', 100, 100)], [{ id: 'e', from: 'a', to: 'a', weight: 100 }], () => {
      const g = edgeGeom(state.edges[0]);
      const a = nodeById('a');
      const onRim = (x, y) => Math.abs(Math.hypot(x - a.x, y - a.y) - R) < 0.001;
      const bulge = Math.hypot((g.sx + 2 * g.cx + g.ex) / 4 - a.x, (g.sy + 2 * g.cy + g.ey) / 4 - a.y);
      // single quadratic: no second control pair anywhere in the geometry
      const single = g.c1 === undefined && g.c2 === undefined && g.tip === undefined;
      // apex of a quadratic sits half-way to the control point, so it never
      // reaches the control distance itself: just require a clear bulge
      return g.loop && onRim(g.sx, g.sy) && onRim(g.ex, g.ey) && bulge > R + 40 && single;
    }));

  check('self-loop has no corner: curvature changes gradually, never jumps', () =>
    withNodes([mkNode('a', 0, 0)], [{ id: 'e', from: 'a', to: 'a', weight: 100 }], () => {
      const pts = edgePoints(edgeGeom(state.edges[0]), 200);
      const turns = [];
      for (let i = 1; i < pts.length - 1; i++) {
        const a1 = Math.atan2(pts[i].y - pts[i - 1].y, pts[i].x - pts[i - 1].x);
        const a2 = Math.atan2(pts[i + 1].y - pts[i].y, pts[i + 1].x - pts[i].x);
        turns.push(angDiff(a1, a2));
      }
      // a corner shows up as one turn far larger than its neighbours
      let maxSpike = 0;
      for (let i = 1; i < turns.length - 1; i++) {
        const around = (turns[i - 1] + turns[i + 1]) / 2;
        if (turns[i] > 1e-4) maxSpike = Math.max(maxSpike, turns[i] / Math.max(around, 1e-4));
      }
      let sum = 0;
      for (const t of turns) sum += t;
      // a loop turns a lot overall (a straight line turns 0) and no single
      // step of the walk dominates, which is what a corner would look like
      return sum > 2 && maxSpike < 1.35;
    }));

  check('demo seed leaves every node at exactly 100 with a real bias', () =>
    withNodes([], [], () => {
      seedDemo();
      const sums = state.nodes.map(n => Math.round(outEdges(n.id).reduce((a, e) => a + e.weight, 0) * 10) / 10);
      const biased = state.edges.some(e => e.weight > 50 && edgeProbability(e) > 0.5);
      return state.nodes.length === 4 && sums.every(v => v === 100) && biased;
    }));

  check('self-loop turns away from the node\'s other edges', () => {
    // one neighbour to the right: the loop must not be drawn on the right
    return withNodes([mkNode('a', 0, 0), mkNode('b', 300, 0)], [
      { id: 'e1', from: 'a', to: 'b', weight: 50 },
      { id: 'e2', from: 'a', to: 'a', weight: 50 },
    ], () => {
      const g = edgeGeom(state.edges[1]);
      return g.loop && g.cx < 0;   // the bulge points away from the neighbour
    });
  });

  check('hit testing follows the curve, not the chord', () =>
    withNodes([mkNode('a', 0, 0), mkNode('b', 400, 0)],
      [{ id: 'e', from: 'a', to: 'b', weight: 100 }], () => {
        const g = edgeGeom(state.edges[0]);
        const onCurve = hitEdge({ x: (g.sx + 2 * g.cx + g.ex) / 4, y: (g.sy + 2 * g.cy + g.ey) / 4 });
        const onChord = hitEdge({ x: 200, y: 0 });
        return onCurve && onCurve.id === 'e' && onChord === null;
      }));

  check('percentage chip never sits on its own curve', () =>
    withNodes([mkNode('a', 100, 100), mkNode('b', 340, 190)], [
      { id: 'e1', from: 'a', to: 'a', weight: 50 },
      { id: 'e2', from: 'a', to: 'b', weight: 50 },
    ], () => {
      // chip is ~40x20 css px, so its centre must stay clear of the curve
      const CHIP_CLEAR = 25;
