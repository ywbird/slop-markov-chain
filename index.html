      return state.edges.every(e => {
        const g = edgeGeom(e);
        return distToPolyline(g.lx, g.ly, edgePoints(g)) >= CHIP_CLEAR;
      });
    }));

  check('a chip is clickable: the hit is this edge or the one covering its chip', () =>
    withNodes([mkNode('a', 100, 100), mkNode('b', 340, 190), mkNode('c', 90, 330)], [
      { id: 'e1', from: 'a', to: 'a', weight: 34 },
      { id: 'e2', from: 'a', to: 'b', weight: 33 },
      { id: 'e3', from: 'a', to: 'c', weight: 33 },
      { id: 'e4', from: 'c', to: 'b', weight: 100 },
    ], () => state.edges.every(e => {
      const g = edgeGeom(e);
      const h = hitEdge({ x: g.lx, y: g.ly });
      if (!h) return false;
      // two chips can overlap; then the topmost (last drawn) one wins, which is
      // what the user sees, so it is enough that *some* chip covers the point
      const hg = edgeGeom(h);
      return h.id === e.id || chipDist({ x: g.lx, y: g.ly }, hg) === 0;
    })));

  check('hit testing finds the bulge of a self-loop', () =>
    withNodes([mkNode('a', 100, 100)], [{ id: 'e', from: 'a', to: 'a', weight: 100 }], () => {
      const g = edgeGeom(state.edges[0]);
      const hit = hitEdge({ x: (g.sx + 2 * g.cx + g.ex) / 4, y: (g.sy + 2 * g.cy + g.ey) / 4 });
      // and the empty space next to the node is not a hit
      const miss = hitEdge({ x: 100 + R + 8, y: 100 });
      return hit && hit.id === 'e' && miss === null;
    }));

  check('delay survives round trip and is clamped to 0..DELAY_MAX', () => {
    const g = { delay: 0.35, walkerCount: 2, nodes: [], edges: [] };
    const ok = deserializeGraph(serializeGraph(g)).delay === 0.35;
    const hi = deserializeGraph(JSON.stringify({ nodes: [], edges: [], delay: 99 })).delay;
    const lo = deserializeGraph(JSON.stringify({ nodes: [], edges: [], delay: -4 })).delay;
    const none = deserializeGraph(JSON.stringify({ nodes: [], edges: [] })).delay;
    return ok && hi === DELAY_MAX && lo === 0 && none === 0;
  });

  // the slide must never be awaited: at delay = 0 the next sound starts at once,
  // so the token is still moving while the next sound plays (overlap by design)
  check('walker slide is decoration only (nothing to await)', () => {
    const savedN = state.nodes, savedE = state.edges;
    try {
      state.nodes = [mkNode('a', 0, 0), mkNode('b', 300, 0)];
      state.edges = [{ id: 'e', from: 'a', to: 'b', weight: 100 }];
      const w = { i: 0, anim: null, pos: null };
      const ret = startWalkerAnim(w, state.nodes[0], state.nodes[1]);
      return ret === undefined && !!w.anim && w.anim.dur > 0;
    } finally {
      state.nodes = savedN; state.edges = savedE;
    }
  });

  check('repel accepts values above the old 3 cap', () => {
    const r = deserializeGraph(JSON.stringify({
      nodes: [{ id: 'a', repel: 8 }, { id: 'b', repel: 99 }, { id: 'c', repel: -2 }], edges: [],
    }));
    return r.nodes[0].repel === 8 && r.nodes[1].repel === REPEL_MAX && r.nodes[2].repel === 0;
  });

  check('high repel pushes harder than low repel', () => {
    const savedN = state.nodes, savedE = state.edges;
    let lowMove = 0, highMove = 0;
    try {
      const run = (repel) => {
        state.nodes = [
          { id: 'a', x: 0, y: 0, label: 'A', gravity: 0, repel, pinned: false },
          { id: 'b', x: R * 15, y: 0, label: 'B', gravity: 0, repel, pinned: false },
        ];
        state.edges = [];
        physics.v.clear();
        // one raw step, far enough apart that the speed cap does not hide the force
        physics.step();
        return Math.abs(state.nodes[1].x - R * 15);
      };
      lowMove = run(1);
      highMove = run(REPEL_MAX);
    } finally { state.nodes = savedN; state.edges = savedE; physics.v.clear(); }
    return highMove > lowMove * 2;
  });

  check('pinned node stays put on screen while physics runs', () => {
    const savedN = state.nodes, savedE = state.edges, savedCam = { x: state.cam.x, y: state.cam.y };
    let stayed = false, cameraHeld = false;
    try {
      state.nodes = [
        { id: 'p', x: 500, y: 300, label: 'P', gravity: 1, repel: 1, pinned: true },
        { id: 'a', x: 100, y: 100, label: 'A', gravity: 1, repel: 1, pinned: false },
        { id: 'b', x: 200, y: 140, label: 'B', gravity: 1, repel: 1, pinned: false },
      ];
      state.edges = [];
      state.cam.x = 0; state.cam.y = 0;
      const before = { x: state.nodes[0].x + state.cam.x, y: state.nodes[0].y + state.cam.y };
      for (let i = 0; i < 60; i++) { physics.step(); physics.followCamera(); }
      const after = { x: state.nodes[0].x + state.cam.x, y: state.nodes[0].y + state.cam.y };
      stayed = Math.abs(after.x - before.x) < 1e-6 && Math.abs(after.y - before.y) < 1e-6;
      cameraHeld = state.cam.x === 0 && state.cam.y === 0;
    } finally {
      state.nodes = savedN; state.edges = savedE; state.cam.x = savedCam.x; state.cam.y = savedCam.y;
    }
    return stayed && cameraHeld;
  });

  check('camera follows the centre of mass while nothing is pinned', () => {
    const savedN = state.nodes, savedCam = { x: state.cam.x, y: state.cam.y };
    let followed = false;
    try {
      state.nodes = [
        { id: 'a', x: 100, y: 100, label: 'A', gravity: 1, repel: 1, pinned: false },
        { id: 'b', x: 300, y: 200, label: 'B', gravity: 1, repel: 1, pinned: false },
      ];
      state.cam.x = 0; state.cam.y = 0;
      followed = physics.followCamera() === true && (state.cam.x !== 0 || state.cam.y !== 0);
    } finally { state.nodes = savedN; state.cam.x = savedCam.x; state.cam.y = savedCam.y; }
    return followed;
  });

  check('dragged node is not moved by physics', () => {
    const savedN = state.nodes, savedE = state.edges, savedDrag = drag;
    let moved = true;
    try {
      state.nodes = [
        { id: 'a', x: 0, y: 0, label: 'A', gravity: 1, repel: 1, pinned: false },
        { id: 'b', x: R * 2.2, y: 0, label: 'B', gravity: 1, repel: 1, pinned: false },
      ];
      state.edges = [];
      physics.v.clear();
      drag = { kind: 'node', id: 'b', ox: 0, oy: 0 };
      physics.step();
      moved = Math.abs(state.nodes[1].x - R * 2.2) > 1e-9 || Math.abs(state.nodes[1].y) > 1e-9;
    } finally { state.nodes = savedN; state.edges = savedE; drag = savedDrag; physics.v.clear(); }
    return moved === false;
  });

  check('deserialize clamps walkerCount', () => {
    const r = deserializeGraph(JSON.stringify({ nodes: [], edges: [], walkerCount: 99 }));
    return r.walkerCount === 9;
  });
  check('startMode/startNodeId survive round trip', () => {
    const g = { startMode: 'selected', startNodeId: 'a', walkerCount: 2,
      nodes: [{ id: 'a', x: 0, y: 0, label: 'A', audio: null }], edges: [] };
    const r = deserializeGraph(serializeGraph(g));
    return r.startMode === 'selected' && r.startNodeId === 'a' &&
      deserializeGraph(JSON.stringify({ nodes: [], edges: [] })).startMode === 'random';
  });
  check('node color survives round trip, bad color dropped', () => {
    const g = { walkerCount: 2, nodes: [
      { id: 'a', x: 0, y: 0, label: 'A', color: PALETTE[1], audio: null },
      { id: 'b', x: 0, y: 0, label: 'B', color: '#123456', audio: null },
    ], edges: [] };
    const r = deserializeGraph(serializeGraph(g));
    return r.nodes[0].color === PALETTE[1] && r.nodes[1].color === null;
  });
  check('duplicate node ids are rejected', () => {
    let threw = false;
    try {
      deserializeGraph(JSON.stringify({ nodes: [{ id: 'a' }, { id: 'a' }], edges: [] }));
    } catch (e) { threw = true; }
    return threw;
  });
  check('stale startNodeId is dropped', () => {
    const r = deserializeGraph(JSON.stringify({
      nodes: [{ id: 'a', label: 'A' }], edges: [], startMode: 'selected', startNodeId: 'ghost',
    }));
    return r.startNodeId === null && r.startMode === 'selected';
  });
  check('probability normalizes by outgoing total', () => {
    const saved = state.edges;
    state.edges = E;
    const p = edgeProbability(E[1]);
    state.edges = saved;
    return Math.abs(p - 0.75) < 1e-9;
  });

  document.title = fails ? 'SELFTEST FAIL' : 'SELFTEST PASS';
  const pre = document.createElement('pre');
  pre.id = 'selftest';
  pre.textContent = out.join('\n') + '\n\n' + (fails ? fails + ' FAILED' : 'ALL PASSED');
  document.body.appendChild(pre);
  console.log(pre.textContent);
}

// ---------------------------------------------------------------- init
(async function init() {
  for (const id of ['cv', 'menu', 'toast', 'run', 'soundFile', 'importFile']) {
    els[id] = document.getElementById(id);
  }
  if (SELF_TEST) { runSelfTests(); return; }

  resize();
  bindUI();
  requestAnimationFrame(frame);

  let restored = false;
  try {
    const saved = await idb.get('graph');
    if (saved) { applyGraph(deserializeGraph(saved)); restored = true; }
  } catch (e) {
    console.warn('load failed', e);
  }
  // only seed the demo graph when there is nothing stored at all, so an
  // intentionally emptied graph stays empty across reloads
  if (!restored) {
    seedDemo();
    scheduleSave();
  }
  fitToView();
  closeMenu();
  syncControls();

  window.__mksg = { state, serializeGraph, deserializeGraph, nextEdgeFrom, pickNext, edgeProbability, audio, idb, physics, REPEL_MAX, DELAY_MAX, R, edgeGeom, hitEdge, freeAngle };
})();

window.addEventListener('error', (e) => {
  document.body.dataset.error = String(e.message || e.type);
});

})();
</script>
